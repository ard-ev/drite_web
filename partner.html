<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bëhu partner | Dritë Guide</title>
    <meta name="description" content="Apliko për ta bërë biznesin tënd pjesë të rrjetit Dritë Guide." />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="img/png" href="./img/logo1.png">
</head>

<body class="partner-page">
    <header class="navbar">
        <a class="brand logo-brand" href="index.html" aria-label="Dritë Guide home">
            <img src="./img/logo1.png" alt="Dritë Guide logo" />
        </a>

        <nav aria-label="Primary navigation">
            <a href="index.html#about" data-i18n="navAbout">Rreth nesh</a>
            <a href="index.html#why" data-i18n="navWhy">Pse Shqipëria</a>
            <a href="index.html#partners" data-i18n="navPartners">Partnerë</a>
            <a href="index.html#contact" data-i18n="navContact">Kontakt</a>
        </nav>

        <div class="nav-actions">
            <button class="lang-switch" type="button" aria-label="Switch language" data-lang-toggle>
                <span data-lang-label>EN</span>
            </button>
            <a class="nav-btn" href="index.html" data-i18n="backButton">Kthehu</a>
        </div>
    </header>

    <main>
        <section class="partner-hero">
            <div class="reveal">
                <p class="eyebrow" data-i18n="pageEyebrow">Partnerët</p>
                <h1 data-i18n="pageTitle">Bëhu pjesë e Dritë Guide.</h1>
                <p class="lead" data-i18n="pageLead">
                    Na dërgo disa të dhëna bazë për biznesin tënd. Ekipi ynë do të të kontaktojë për hapat e radhës.
                </p>
            </div>

            <form class="partner-form reveal delay-1" action="/api/partner" method="post" accept-charset="UTF-8"
                data-partner-form>
                <input class="form-honeypot" type="text" name="website" tabindex="-1" autocomplete="off"
                    aria-hidden="true" />

                <label for="full-name" data-i18n="nameLabel">Emri dhe mbiemri</label>
                <input id="full-name" name="fullName" type="text" placeholder="Shkruaj emrin tënd"
                    data-i18n-placeholder="namePlaceholder" autocomplete="name" maxlength="120" required />

                <label for="business-name" data-i18n="businessLabel">Emri i biznesit</label>
                <input id="business-name" name="businessName" type="text" placeholder="Shkruaj emrin e biznesit"
                    data-i18n-placeholder="businessPlaceholder" autocomplete="organization" maxlength="140" required />

                <label for="business-type" data-i18n="typeLabel">Lloji i biznesit</label>
                <select id="business-type" name="businessType" required>
                    <option value="" data-i18n="typePlaceholder">Zgjidh një kategori</option>
                    <option value="Hotel" data-i18n="typeHotel">Hotel</option>
                    <option value="Restaurant" data-i18n="typeRestaurant">Restorant</option>
                    <option value="Coffee shop" data-i18n="typeCoffee">Kafene</option>
                    <option value="Bar" data-i18n="typeBar">Bar</option>
                    <option value="Other" data-i18n="typeOther">Tjetër</option>
                </select>

                <label for="phone-number" data-i18n="phoneLabel">Numri i telefonit</label>
                <input id="phone-number" name="phone" type="tel" placeholder="+355 69 123 4567"
                    data-i18n-placeholder="phonePlaceholder" autocomplete="tel" inputmode="tel" maxlength="32"
                    pattern="^[0-9+() .-]{7,32}$" required />

                <label for="email" data-i18n="emailLabel">Email</label>
                <input id="email" name="email" type="email" placeholder="email@example.com"
                    data-i18n-placeholder="emailPlaceholder" autocomplete="email" maxlength="160" required />

                <label for="message" data-i18n="messageLabel">Mesazhi</label>
                <textarea id="message" name="message" placeholder="Shkruaj çfarë dëshiron të ndash me ne"
                    data-i18n-placeholder="messagePlaceholder" maxlength="1200" rows="5" required></textarea>

                <button class="btn primary" type="submit" data-i18n="submitButton">Dërgo aplikimin</button>
                <p class="form-status" data-form-status role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <span data-i18n="footerBrand">© 2026 Dritë Guide</span>
        <span data-i18n="footerLine">Ndiq dritën tënde.</span>
    </footer>

    <script>
        const translations = {
            sq: {
                navAbout: "Rreth nesh",
                navWhy: "Pse Shqipëria",
                navPartners: "Partnerë",
                navContact: "Kontakt",
                backButton: "Kthehu",
                pageEyebrow: "Partnerët",
                pageTitle: "Bëhu pjesë e Dritë Guide.",
                pageLead: "Na dërgo disa të dhëna bazë për biznesin tënd. Ekipi ynë do të të kontaktojë për hapat e radhës.",
                nameLabel: "Emri dhe mbiemri",
                namePlaceholder: "Shkruaj emrin tënd",
                businessLabel: "Emri i biznesit",
                businessPlaceholder: "Shkruaj emrin e biznesit",
                typeLabel: "Lloji i biznesit",
                typePlaceholder: "Zgjidh një kategori",
                typeHotel: "Hotel",
                typeRestaurant: "Restorant",
                typeCoffee: "Kafene",
                typeBar: "Bar",
                typeOther: "Tjetër",
                phoneLabel: "Numri i telefonit",
                phonePlaceholder: "+355 69 123 4567",
                emailLabel: "Email",
                emailPlaceholder: "email@example.com",
                messageLabel: "Mesazhi",
                messagePlaceholder: "Shkruaj çfarë dëshiron të ndash me ne",
                submitButton: "Dërgo aplikimin",
                sendingStatus: "Duke u dërguar...",
                successStatus: "Aplikimi u dërgua me sukses. Do të të kontaktojmë së shpejti.",
                errorStatus: "Nuk u dërgua. Provo përsëri ose na shkruaj direkt te support@driteguide.com.",
                footerBrand: "© 2026 Dritë Guide",
                footerLine: "Ndiq dritën tënde."
            },
            en: {
                navAbout: "About",
                navWhy: "Why Albania",
                navPartners: "Partners",
                navContact: "Contact",
                backButton: "Back",
                pageEyebrow: "Partners",
                pageTitle: "Become part of Dritë Guide.",
                pageLead: "Send us a few basic details about your business. Our team will contact you with the next steps.",
                nameLabel: "Full name",
                namePlaceholder: "Enter your name",
                businessLabel: "Business name",
                businessPlaceholder: "Enter the business name",
                typeLabel: "Business type",
                typePlaceholder: "Choose a category",
                typeHotel: "Hotel",
                typeRestaurant: "Restaurant",
                typeCoffee: "Coffee shop",
                typeBar: "Bar",
                typeOther: "Other",
                phoneLabel: "Phone number",
                phonePlaceholder: "+355 69 123 4567",
                emailLabel: "Email",
                emailPlaceholder: "email@example.com",
                messageLabel: "Message",
                messagePlaceholder: "Write anything else you want to share",
                submitButton: "Send application",
                sendingStatus: "Sending...",
                successStatus: "Application sent successfully. We will contact you soon.",
                errorStatus: "Could not send. Please try again or email support@driteguide.com directly.",
                footerBrand: "© 2026 Dritë Guide",
                footerLine: "Follow your light."
            }
        };

        const languageButton = document.querySelector("[data-lang-toggle]");
        const languageLabel = document.querySelector("[data-lang-label]");

        function setLanguage(language) {
            document.documentElement.lang = language === "sq" ? "sq" : "en";
            document.querySelectorAll("[data-i18n]").forEach((element) => {
                const key = element.dataset.i18n;
                element.textContent = translations[language][key];
            });
            document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {
                const key = element.dataset.i18nPlaceholder;
                element.placeholder = translations[language][key];
            });
            languageLabel.textContent = language === "sq" ? "EN" : "SQ";
            localStorage.setItem("drite-language", language);
        }

        languageButton.addEventListener("click", () => {
            const nextLanguage = document.documentElement.lang === "sq" ? "en" : "sq";
            setLanguage(nextLanguage);
        });

        setLanguage(localStorage.getItem("drite-language") || "sq");

        const partnerForm = document.querySelector("[data-partner-form]");
        const formStatus = document.querySelector("[data-form-status]");

        partnerForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!partnerForm.reportValidity()) {
                return;
            }

            const language = document.documentElement.lang === "sq" ? "sq" : "en";
            const submitButton = partnerForm.querySelector("button[type='submit']");
            const formData = new FormData(partnerForm);

            if (formData.get("website")) {
                partnerForm.reset();
                return;
            }

            submitButton.disabled = true;
            formStatus.textContent = translations[language].sendingStatus;
            formStatus.dataset.state = "sending";

            try {
                const response = await fetch(partnerForm.action, {
                    method: "POST",
                    headers: {
                        Accept: "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(Object.fromEntries(formData))
                });

                if (!response.ok) {
                    throw new Error("Form submission failed");
                }

                partnerForm.reset();
                formStatus.textContent = translations[language].successStatus;
                formStatus.dataset.state = "success";
            } catch (error) {
                formStatus.textContent = translations[language].errorStatus;
                formStatus.dataset.state = "error";
            } finally {
                submitButton.disabled = false;
            }
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("is-visible");
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.18 });

        document.querySelectorAll(".reveal").forEach((element) => observer.observe(element));
    </script>
</body>

</html>
