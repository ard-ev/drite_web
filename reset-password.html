<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset | Drite Guide</title>
    <meta name="description" content="Reset your Drite Guide password securely." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="img/png" href="./img/logo1.png">
</head>

<body class="verify-page">
    <main class="verify-shell">
        <section class="verify-panel reveal" aria-labelledby="reset-title">
            <a class="logo-brand verify-logo" href="index.html" aria-label="Drite Guide home">
                <img src="./img/logo1.png" alt="Drite Guide logo" />
            </a>

            <p class="eyebrow" data-reset-eyebrow>Password reset</p>
            <h1 id="reset-title" data-reset-title>Reset your password.</h1>
            <p class="lead" data-reset-lead>
                Enter a new password below. Once saved, you can use it to sign in to Drite Guide.
            </p>

            <form class="reset-form" data-reset-form>
                <label for="new-password">New password</label>
                <input id="new-password" name="password" type="password" minlength="8" autocomplete="new-password"
                    placeholder="Enter new password" required />

                <label for="confirm-password">Confirm password</label>
                <input id="confirm-password" name="confirm-password" type="password" minlength="8"
                    autocomplete="new-password" placeholder="Confirm new password" required />

                <button class="btn primary" type="submit" data-reset-submit disabled>Update password</button>
            </form>

            <p class="reset-message" data-reset-message>Checking your reset link...</p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
        const SUPABASE_PUBLIC_KEY = "YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY";

        const resetForm = document.querySelector("[data-reset-form]");
        const passwordInput = document.querySelector("#new-password");
        const confirmPasswordInput = document.querySelector("#confirm-password");
        const submitButton = document.querySelector("[data-reset-submit]");
        const message = document.querySelector("[data-reset-message]");
        const params = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.slice(1));
        const hasError = params.has("error") || params.has("error_description") || hashParams.has("error") || hashParams.has("error_description");
        const isConfigured = !SUPABASE_URL.includes("YOUR_PROJECT_ID") && !SUPABASE_PUBLIC_KEY.includes("YOUR_SUPABASE");
        let supabaseClient = null;

        function setMessage(text, type = "neutral") {
            message.textContent = text;
            message.dataset.status = type;
        }

        function setFormEnabled(isEnabled) {
            submitButton.disabled = !isEnabled;
        }

        function showError(title, lead, detail) {
            document.body.classList.add("verify-error");
            document.querySelector("[data-reset-eyebrow]").textContent = "Reset failed";
            document.querySelector("[data-reset-title]").textContent = title;
            document.querySelector("[data-reset-lead]").textContent = lead;
            setMessage(detail, "error");
            setFormEnabled(false);
        }

        async function prepareResetSession() {
            if (!isConfigured || !window.supabase) {
                showError(
                    "Supabase is not configured.",
                    "Add your Supabase project URL and public anon or publishable key to this page before using password reset.",
                    "The reset form is disabled until the Supabase config is added."
                );
                return;
            }

            if (hasError) {
                const errorDescription = params.get("error_description") || hashParams.get("error_description");
                showError(
                    "The reset link could not be used.",
                    "The link may have expired or already been used. Request a new password reset email and try again.",
                    errorDescription || "Please request a new password reset email."
                );
                return;
            }

            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY, {
                auth: {
                    detectSessionInUrl: false
                }
            });

            try {
                const code = params.get("code");
                const accessToken = hashParams.get("access_token");
                const refreshToken = hashParams.get("refresh_token");

                if (code) {
                    const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
                    if (error) throw error;
                } else if (accessToken && refreshToken) {
                    const { error } = await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });
                    if (error) throw error;
                } else {
                    const { data, error } = await supabaseClient.auth.getSession();
                    if (error) throw error;
                    if (!data.session) {
                        throw new Error("No active password reset session was found.");
                    }
                }

                setFormEnabled(true);
                setMessage("Choose a password with at least 8 characters.", "neutral");
                passwordInput.focus();
            } catch (error) {
                showError(
                    "The reset link could not be used.",
                    "The link may have expired or already been used. Request a new password reset email and try again.",
                    error.message || "Please request a new password reset email."
                );
            }
        }

        resetForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const password = passwordInput.value;
            const confirmedPassword = confirmPasswordInput.value;

            if (password.length < 8) {
                setMessage("Use at least 8 characters for your new password.", "error");
                return;
            }

            if (password !== confirmedPassword) {
                setMessage("The passwords do not match.", "error");
                return;
            }

            submitButton.disabled = true;
            passwordInput.disabled = true;
            confirmPasswordInput.disabled = true;
            setMessage("Updating your password...", "neutral");

            try {
                const { error } = await supabaseClient.auth.updateUser({ password });
                if (error) throw error;
            } catch (error) {
                submitButton.disabled = false;
                passwordInput.disabled = false;
                confirmPasswordInput.disabled = false;
                setMessage(error.message || "Could not update your password. Please try again.", "error");
                return;
            }

            setFormEnabled(false);
            resetForm.reset();
            document.querySelector("[data-reset-eyebrow]").textContent = "Password updated";
            document.querySelector("[data-reset-title]").textContent = "Your password has been reset.";
            document.querySelector("[data-reset-lead]").textContent = "You can now sign in to Drite Guide with your new password.";
            setMessage("Password updated successfully.", "success");
            await supabaseClient.auth.signOut();
        });

        prepareResetSession();

        requestAnimationFrame(() => {
            document.querySelector(".reveal").classList.add("is-visible");
        });
    </script>
</body>

</html>
