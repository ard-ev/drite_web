<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verified | Drite Guide</title>
    <meta name="description" content="Your email was verified successfully in Drite Guide." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="img/png" href="./img/logo1.png">
</head>

<body class="verify-page">
    <main class="verify-shell">
        <section class="verify-panel reveal" aria-labelledby="verify-title">
            <a class="logo-brand verify-logo" href="index.html" aria-label="Drite Guide home">
                <img src="./img/logo1.png" alt="Drite Guide logo" />
            </a>

            <div class="verify-status" aria-hidden="true">
                <span></span>
            </div>

            <p class="eyebrow" data-verify-eyebrow>Email verified</p>
            <h1 id="verify-title" data-verify-title>Your email is confirmed.</h1>
            <p class="lead" data-verify-lead>
                Thank you. Your account is ready, and you can now continue with Drite Guide.
            </p>

            <div class="verify-actions">
                <a class="btn primary" href="index.html">Confirm</a>
            </div>
        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const hasError = params.has("error") || params.has("error_description");

        if (hasError) {
            document.body.classList.add("verify-error");
            document.querySelector("[data-verify-eyebrow]").textContent = "Verification failed";
            document.querySelector("[data-verify-title]").textContent = "The link could not be verified.";
            document.querySelector("[data-verify-lead]").textContent = "The link may have expired or already been used. Request a new verification email and try again.";
        }

        requestAnimationFrame(() => {
            document.querySelector(".reveal").classList.add("is-visible");
        });
    </script>
</body>

</html>
